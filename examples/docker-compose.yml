services:
  paperless-mcp:
    image: ghcr.io/omgapuppy/paperless-mcp:latest
    init: true
    stdin_open: true
    read_only: true
    env_file:
      - config.env
    environment:
      PAPERLESS_API_TOKEN_FILE: /run/secrets/paperless_api_token
      PAPERLESS_MCP_AUDIT_DIR: /data/audit
      PAPERLESS_MCP_TAXONOMY_POLICY_FILE: /config/taxonomy-policy.yaml
    secrets:
      - paperless_api_token
    volumes:
      - paperless_mcp_audit:/data/audit
      - ./taxonomy-policy.example.yaml:/config/taxonomy-policy.yaml:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  paperless_api_token:
    # Native Linux: make this root:10001 with mode 0440 for the non-root container.
    # Never commit it.
    file: ./paperless_api_token.secret

volumes:
  paperless_mcp_audit:
